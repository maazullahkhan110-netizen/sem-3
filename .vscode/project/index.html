<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        /* MAIN BOX */

        .container {
            width: 80%;
            max-width: 1000px;
            margin: 40px auto;
            border: 2px solid black;
            min-height: 600px;
        }

        /* TOP NAVIGATION */

        .navbar {
            height: 80px;
            border-bottom: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .navbar button {
            background: white;
            border: 1px solid black;
            padding: 10px 30px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .navbar button:hover {
            background: #eeeeee;
        }
        /* HEADING */
        .title {
            text-align: center;
            margin: 30px 0 20px;
        }
        .title h1 {
            margin: 0;
            font-size: 28px;
        }

        /* TABLE */

        .table-container {
            width: 90%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }

        /* BOOK BUTTON */

        .book-btn {
            padding: 8px 18px;
            background: white;
            border: 1px solid black;
            border-radius: 4px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #eeeeee;
        }

        /* CART */

        .cart-section {
            width: 90%;
            margin: 30px auto;

            border: 1px solid black;

            padding: 20px;
        }

        .cart-section h2 {
            margin-top: 0;
        }

        #cartItems {
            margin-bottom: 15px;
        }

        .cart-item {
            padding: 8px 0;
            border-bottom: 1px solid #aaa;
        }

        .total {
            font-weight: bold;
            margin-top: 15px;
        }

        .payment-btn {
            margin-top: 15px;

            padding: 10px 25px;

            background: white;

            border: 1px solid black;

            border-radius: 4px;

            cursor: pointer;
        }

        .payment-btn:hover {
            background: #eeeeee;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- NAVIGATION -->

    <nav class="navbar">

        <button onclick="goHome()">
            Home
        </button>

        <button onclick="showSubjects()">
            Subject
        </button>

        <button onclick="showPayment()">
            Payment
        </button>

        <button onclick="login()">
            Login
        </button>

    </nav>


    <!-- MAIN HEADING -->

    <div class="title">

        <h1>
            Book Store
        </h1>

    </div>


    <!-- BOOK TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>S. No.</th>

                    <th>Subject</th>

                    <th>Price</th>

                    <th>Book</th>

                    <th>Add to Cart</th>

                </tr>

            </thead>


            <tbody id="bookTable">

            </tbody>

        </table>

    </div>


    <!-- CART -->

    <div class="cart-section">

        <h2>
            Shopping Cart
        </h2>

        <div id="cartItems">
            Cart is empty.
        </div>

        <div class="total">

            Total:
            ₹<span id="totalPrice">0</span>

        </div>

        <button
            class="payment-btn"
            onclick="showPayment()">

            Proceed to Payment

        </button>

    </div>


</div>


<script>

    let books = [];

    let cart = [];


    /* LOAD BOOKS FROM SERVER */

    async function loadBooks() {

        try {

            const response =
                await fetch("/api/books");

            books =
                await response.json();

            displayBooks();

        }

        catch (error) {

            console.log(error);

            alert(
                "Server se connection nahi ho raha."
            );

        }

    }


    /* DISPLAY BOOKS */

    function displayBooks() {

        const table =
            document.getElementById("bookTable");

        table.innerHTML = "";


        books.forEach((book, index) => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${book.subject}
                </td>

                <td>
                    ₹${book.price}
                </td>

                <td>
                    ${book.book}
                </td>

                <td>

                    <button
                        class="book-btn"
                        onclick="addToCart(${book.id})">

                        Add to Cart

                    </button>

                </td>

            `;


            table.appendChild(row);

        });

    }


    /* ADD TO CART */

    function addToCart(id) {

        const book =
            books.find(
                item => item.id === id
            );


        if (!book) {
            return;
        }


        cart.push(book);

        displayCart();

        alert(
            `${book.book} added to cart!`
        );

    }


    /* DISPLAY CART */

    function displayCart() {

        const cartItems =
            document.getElementById(
                "cartItems"
            );


        if (cart.length === 0) {

            cartItems.innerHTML =
                "Cart is empty.";

            document.getElementById(
                "totalPrice"
            ).innerText = "0";

            return;
        }


        cartItems.innerHTML = "";


        let total = 0;


        cart.forEach((book, index) => {

            total += book.price;


            const item =
                document.createElement("div");


            item.className =
                "cart-item";


            item.innerHTML = `

                ${index + 1}.
                ${book.book}
                - ₹${book.price}

            `;


            cartItems.appendChild(item);

        });


        document.getElementById(
            "totalPrice"
        ).innerText = total;

    }


    /* NAVIGATION */

    function goHome() {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function showSubjects() {

        alert(
            "Available subjects: Data Structures, Python, Database, Web Development and Mathematics."
        );

    }


    function showPayment() {

        if (cart.length === 0) {

            alert(
                "Please add a book to cart first."
            );

            return;
        }


        let total = 0;


        cart.forEach(book => {
            total += book.price;
        });


        alert(
            `Payment amount: ₹${total}`
        );

    }


    function login() {

        alert(
            "Login page will be added later."
        );

    }


    /* START */

    loadBooks();

</script>


</body>

</html>
