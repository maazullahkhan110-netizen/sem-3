<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABES Engineering College</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: #222;
        }
        header {
            background: #0d47a1;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }
        section {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        .hero {
            background: #e3f2fd;
            padding: 40px 20px;
            border-radius: 10px;
        }
        .college-image {
            width: 100%;
            max-width: 1000px;
            height: auto;
            border-radius: 16px;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        footer {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
    <header>
        <h1>ABES ENGINEERING COLLEGE</h1>
    </header>

    <section class="hero">
        <h2>Welcome to Excellence in Education</h2>
        <p>ABES Engineering College is committed to nurturing innovation, leadership, and technical excellence.</p>
        <img class="college-image" src="https://tse4.mm.bing.net/th/id/OIP.YRLnFB2_z8EqsilbfSMoQAHaD9?r=0&pid=Api&P=0&h=180" alt="ABES Engineering College campus">
    </section>
   <footer>
        <p>&copy; 2026 ABES Engineering College. All rights reserved.</p>
    </footer>
</body>
</html>
